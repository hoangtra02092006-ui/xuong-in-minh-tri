# Frontend Xưởng in Minh Trí trên Render Static Site (spec 14.1).
services:
  - type: web
    name: xuong-in-minh-tri
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://in.dreamate.me
      # Vite 8 needs Node >= 20.19
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
