name: ci
on:
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      # Maven Central sometimes answers 429 to the wrapper download: cache the
      # distribution and retry with backoff instead of failing the PR.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Download Maven via wrapper (retry on 429)
        run: |
          for i in 1 2 3 4; do
            ./mvnw -B -q --version && exit 0
            echo "Wrapper download failed, retry $i in $((i * 15)) s"
            sleep $((i * 15))
          done
          exit 1
      - run: ./mvnw -B verify

  docker:
    # Builds the backend image and checks the health endpoint answers inside a 1.5 GB container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xuong-in-backend:ci backend
      - name: Start container with the production memory limit
        run: |
          docker run -d --name xi -m 1536m -p 127.0.0.1:8095:8080 xuong-in-backend:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8095/api/v1/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs xi
          exit 1
      - run: docker exec xi sh -c 'command -v wget'
