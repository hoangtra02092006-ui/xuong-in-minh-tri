# Site riêng cho backend Xưởng in Minh Trí. Không sửa site mitritex.tino.page của n8n.
# Đặt vào /etc/nginx/sites-available/in.dreamate.me rồi symlink sang sites-enabled.
# Chạy certbot --nginx -d in.dreamate.me sau khi bản ghi DNS đã trỏ về máy chủ;
# certbot tự thêm khối listen 443 và chuyển hướng HTTP sang HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name in.dreamate.me;

    # Upload tối đa 200 MB một lần (spec 13), khớp multipart của Spring.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zip nhiều tấm và TIF chờ dựng có thể mất vài phút: không cắt sớm, không đệm cả file.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
